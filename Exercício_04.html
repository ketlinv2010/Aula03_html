<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tabela 4</title>
    </head>

    <body>
        <main>
            <table border="1" style="width:100%;">
                <thead>
                    <tr>
                        <th rowspan="3">Day</th>
                        <th colspan="3">Seminar</th>
                    </tr>

                    <tr>
                        <th colspan="2">Schedule</th>
                        <th rowspan="2">Topic</th>
                    </tr>

                    <tr>
                        <th>Begin</th>
                        <th>End</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td rowspan="2">Monday</td>
                        <td rowspan="2" style="text-align: center; background-color:khaki">8:00 a.m</td>
                        <td rowspan="2" style="text-align: center; background-color:darkviolet;">5:00 p.m</td>
                        <td style="text-align: center;">Introdution to XML</td>
                    </tr>

                    <tr>
                        <td style="text-align: center;">Validity: DTD and Relax NG</td>
                    </tr>

                    <tr>
                        <td rowspan="3">Tuesday</td>
                        <td style="text-align: center; background-color:khaki">8:00 a.m</td>
                        <td style="text-align: center; background-color:khaki">11:00 a.m</td>
                        <td rowspan="2" style="text-align: center;">XPath</td>
                    </tr>

                    <tr>
                        <td style="text-align: center; background-color:khaki">11: a.m</td>
                        <td style="text-align: center; background-color:aquamarine;">2:00 p.m</td>
                        
                    </tr>

                    <tr>
                        <td style="text-align: center; background-color:aquamarine;">2:00 p.m</td>
                        <td style="text-align: center; background-color:darkviolet;">5:00 p.m</td>
                        <td style="text-align: center;">XSL Transformations</td>
                    </tr>

                    <tr>
                        <td>Wednesday</td>
                        <td style="text-align: center; background-color:khaki">8.00 a.m</td>
                        <td style="text-align: center; background-color:aquamarine;">12:00 p.m</td>
                        <td style="text-align: center;">XSL Formatting Objects</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
